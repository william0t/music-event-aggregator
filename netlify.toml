[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXT_PUBLIC_SUPABASE_ANON_KEY is intentionally public (client-side key by design)
  # BANDSINTOWN_APP_ID is a non-secret app name string
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SITE_URL,BANDSINTOWN_APP_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled sync: runs every day at 4am UTC (10pm MT)
[functions."sync-events"]
  schedule = "0 4 * * *"
